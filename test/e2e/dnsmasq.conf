# DHCP and DNS for the e2e network, with no PXE options: hephaestus answers PXE through proxyDHCP.
# The hephaestus.e2e.test record is passed on the command line (--address), because proxy mode points it at Caddy.
no-daemon
no-resolv
no-hosts
interface=eth0
bind-interfaces
domain=e2e.test
dhcp-range=10.99.0.100,10.99.0.150,255.255.255.0,1h
dhcp-option=option:router,10.99.0.1
dhcp-option=option:dns-server,10.99.0.2
dhcp-authoritative
log-dhcp
log-queries
log-facility=-
