cluster:
    id: ref+op://lab/bundle/cluster.id
    secret: ref+op://lab/bundle/cluster.secret
secrets:
    bootstraptoken: ref+op://lab/bundle/secrets.bootstraptoken
    secretboxencryptionsecret: ref+op://lab/bundle/secrets.secretboxencryptionsecret
trustdinfo:
    token: ref+op://lab/bundle/trustdinfo.token
certs:
    etcd:
        crt: ref+op://lab/bundle/certs.etcd.crt
        key: ref+op://lab/bundle/certs.etcd.key
    k8s:
        crt: ref+op://lab/bundle/certs.k8s.crt
        key: ref+op://lab/bundle/certs.k8s.key
    k8saggregator:
        crt: ref+op://lab/bundle/certs.k8saggregator.crt
        key: ref+op://lab/bundle/certs.k8saggregator.key
    k8sserviceaccount:
        key: ref+op://lab/bundle/certs.k8sserviceaccount.key
    os:
        crt: ref+op://lab/bundle/certs.os.crt
        key: ref+op://lab/bundle/certs.os.key
