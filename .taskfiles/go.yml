version: '3'

vars:
  GOLANGCI: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
  VERSION: {sh: git describe --tags --always --dirty}
  COMMIT: {sh: git rev-parse --short HEAD}
  DB_PKGS: ./internal/db/... ./internal/fleet/...
  DATE: {sh: date -u +%Y-%m-%dT%H:%M:%SZ}

tasks:
  ci:
    desc: All Go checks
    cmds:
      - task: fmt:check
      - task: tidy:check
      - task: machinery
      - task: noexec
      - task: lint
      - task: vuln
      - task: :render:parity
      - task: test
      - task: sdk-smoke
      - task: cross
      - task: test-integration
      - task: cover:db
  lint:
    desc: golangci-lint v2.14.0 with the go-tricorder baseline (stock binary; see .golangci.yml head)
    cmds:
      - '{{.GOLANGCI}} run'
  fmt:
    desc: Format Go sources
    cmds:
      - '{{.GOLANGCI}} fmt'
  fmt:check:
    desc: Fail if sources are unformatted
    cmds:
      - '{{.GOLANGCI}} fmt --diff'
  tidy:check:
    desc: Fail if go.mod/go.sum are not tidy
    cmds:
      - go mod tidy -diff
  machinery:
    desc: machinery stays at v1.14.4 and the talos module is never required (the vendored Topf code takes the pkg/machinery module only)
    cmds:
      - test "$(go list -m -f '{{"{{.Version}}"}}' github.com/siderolabs/talos/pkg/machinery)" = v1.14.4
      - test -z "$(go list -m all | grep -E '^github.com/siderolabs/talos ')"
  noexec:
    desc: The vendored Topf code imports no os/exec (it renders offline and runs no process)
    cmds:
      - test -z "$(go list -f '{{"{{join .Imports \"\\n\"}}"}}' ./internal/third_party/topf/... | grep -x os/exec)"
  vuln:
    desc: Scan dependencies for known vulnerabilities
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  test:
    desc: Unit tests with the race detector
    cmds:
      - go test ./... -race
  sdk-smoke:
    desc: The real 1Password SDK builds without cgo and refuses a dummy token with an error, not a panic
    env:
      CGO_ENABLED: '0'
    cmds:
      - go test -tags sdksmoke ./internal/secrets/ -run TestOnePassword_SmokeDummyToken -count=1 -v
  build:
    desc: Build bin/hephaestus
    env:
      CGO_ENABLED: '0'
    cmds:
      - go build -trimpath -ldflags "-X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.DATE}}" -o bin/hephaestus ./cmd/hephaestus
  cross:
    desc: Every package cross-compiles for linux and darwin, amd64 and arm64 (go-standards §9.4)
    env:
      CGO_ENABLED: '0'
    cmds:
      - |
        set -eu
        for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
          GOOS="${p%/*}" GOARCH="${p#*/}" go build -o /dev/null ./...
        done
  test-integration:
    desc: Integration tests (Postgres via docker; needs DOCKER_HOST)
    cmds:
      - go test -tags integration ./... -race
  cover:db:
    desc: Every exported method in db.go and *repository.go files runs on SQLite and on Postgres (WL database rule 2)
    cmds:
      - mkdir -p bin
      - go test -coverprofile=bin/cover-sqlite.out {{.DB_PKGS}}
      - go test -tags integration -run Postgres -coverprofile=bin/cover-postgres.out {{.DB_PKGS}}
      - |
        set -eu
        for f in bin/cover-sqlite.out bin/cover-postgres.out; do
          go tool cover -func="$f" | awk -v f="$f" '$1 ~ /\/(db|[a-z_]*repository)\.go:/ && $2 ~ /^[A-Z]/ && $3 == "0.0%" {print f ": not executed: " $1 " " $2; bad=1} END {exit bad}'
        done
