<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare: A (React + antd) vs B (htmx + shadcn-style)</title>
<style>
:root{
  --color-bg:#f4f4f5; --color-surface:#ffffff; --color-text:#18181b; --color-muted:#52525b; --color-border:#d4d4d8; --color-accent:#18181b; --color-accent-text:#fafafa;
  --scale:.5; --frame-w:1440px; --frame-h:900px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--color-bg);color:var(--color-text);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
header{padding:12px 20px;display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--color-border);background:var(--color-surface)}
h1{font-size:16px;margin:0}
header p{margin:0;color:var(--color-muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px 20px}
.col h2{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 0 8px}
.col h2 b{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;background:var(--color-accent);color:var(--color-accent-text)}
.col h2 span{color:var(--color-muted);font-weight:400}
.frame{width:calc(var(--frame-w)*var(--scale));height:calc(var(--frame-h)*var(--scale));border:1px solid var(--color-border);border-radius:8px;overflow:hidden;background:var(--color-surface)}
iframe{width:var(--frame-w);height:var(--frame-h);border:0;transform:scale(var(--scale));transform-origin:0 0;display:block}
.note{padding:0 20px 16px;color:var(--color-muted);font-size:13px}
</style>
</head>
<body>
<header><h1>Fleet UI: tier comparison</h1><p>Both frames render 1440x900 and are scaled to fit. Each opens with the talos-05-wrk detail panel (#detail). Open a file directly to interact at full size.</p></header>
<div class="grid">
  <section class="col"><h2><b>A</b>Heavy tier <span>React + Ant Design v6</span></h2>
    <div class="frame"><iframe src="a-react-antd.html#detail" title="Mockup A: React + Ant Design v6"></iframe></div></section>
  <section class="col"><h2><b>B</b>Light tier <span>htmx + shadcn-style</span></h2>
    <div class="frame"><iframe src="b-htmx-shadcn.html#detail" title="Mockup B: htmx + shadcn-style"></iframe></div></section>
</div>
<p class="note"><a href="a-react-antd.html">Open A</a> | <a href="b-htmx-shadcn.html">Open B</a></p>
<script>
function fit(){
  const w = (document.documentElement.clientWidth - 40 - 16) / 2;
  document.documentElement.style.setProperty('--scale', Math.min(1, Math.max(.25, w/1440)).toFixed(3));
}
addEventListener('resize', fit); fit();
</script>
</body>
</html>
